pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'neshane-backend'

include 'architecture-fixtures:domain'
include 'architecture-fixtures:application'
include 'architecture-fixtures:adapter'
include 'services:reference-service'
include 'services:reference-peer-service'
include 'platform-libraries:observability'
include 'contract-tests:http'
include 'contract-tests:events'
include 'contract-tests:tenant'
include 'architecture-tests'
