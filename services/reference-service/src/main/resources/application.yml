spring:
  application:
    name: ${SERVICE_NAME:reference-service}
  jmx:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  main:
    lazy-initialization: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

neshane:
  reference:
    service-name: ${SERVICE_NAME:reference-service}
    diagnostics:
      enabled: false
