description = 'AP-01 isolated Customer application candidate.'

dependencies {
    api project(':services:customer-service:domain')
}

sourceSets {
    specification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('verifyCustomerApplication', JavaExec) {
    group = 'verification'
    description = 'Runs isolated Customer application specifications.'
    dependsOn tasks.named('specificationClasses')
    classpath = sourceSets.specification.runtimeClasspath
    mainClass = 'ir.neshane.customer.application.CustomerApplicationSpecification'
}

tasks.named('check') {
    dependsOn tasks.named('verifyCustomerApplication')
}
