dependencies {
    implementation enforcedPlatform(libs.spring.boot.dependencies)
    implementation libs.jackson.databind
    implementation libs.json.schema.validator

    testImplementation enforcedPlatform(libs.spring.boot.dependencies)
    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}

def contractRoot = rootProject.layout.projectDirectory.dir('contracts/routing')

tasks.register('validateRoutingCandidateContracts', JavaExec) {
    group = 'verification'
    description = 'Validates proposed V3-022 routing contracts without accepting a baseline.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ir.neshane.contract.routing.RoutingContractVerifier'
    args 'validate-candidate', contractRoot.asFile.absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('validateRoutingCandidateContracts')
}

tasks.withType(Test).configureEach {
    systemProperty 'routingContractRoot', contractRoot.asFile.absolutePath

    inputs.file(
        rootProject.layout.projectDirectory.file(
            'deployment/shared/fixtures/v1/cell-registry.json'
        )
    ).withPathSensitivity(PathSensitivity.RELATIVE)
}
